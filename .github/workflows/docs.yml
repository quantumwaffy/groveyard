name: Docs

on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "src/**/*.py"
      - "mkdocs.yml"
      - "CONTRIBUTING.md"
      - "CHANGELOG.md"
      - "SECURITY.md"
      - "CODE_OF_CONDUCT.md"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-revision-date-localized-plugin needs full history
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --group docs
      - run: uv run mkdocs gh-deploy --force --no-history --strict
