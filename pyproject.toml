[project]
name = "groveyard"
version = "0.1.0"
description = "A modern, fully typed async Python library for GrovePi+ sensors and actuators on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sasha Chistyh", email = "sashachistyh@gmail.com" }]
maintainers = [{ name = "Sasha Chistyh", email = "sashachistyh@gmail.com" }]
keywords = [
    "grovepi",
    "grove",
    "raspberry-pi",
    "i2c",
    "iot",
    "asyncio",
    "async",
    "sensors",
    "hardware",
    "embedded",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Real-hardware I2C backend. Not needed for development, testing, or CI — the
# fake transport (groveyard.transport.fake) covers everything off-device.
hardware = ["smbus2>=0.4"]

[project.urls]
Homepage = "https://quantumwaffy.github.io/groveyard/"
Documentation = "https://quantumwaffy.github.io/groveyard/"
Repository = "https://github.com/quantumwaffy/groveyard"
Issues = "https://github.com/quantumwaffy/groveyard/issues"
Changelog = "https://quantumwaffy.github.io/groveyard/changelog/"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "ty",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-include-markdown-plugin>=7.3.0",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
# ASYNC (flake8-async): flags blocking calls made from `async` code (time.sleep,
#   sync I/O) — the library's #1 hazard.
# ANN: type annotations are mandatory everywhere.
# D:   docstrings are mandatory (google convention).
# TID: bans relative imports (absolute imports only).
# Q:   consistent quotes (and flags avoidable escapes).
# The rest are general correctness/style/modernization rules.
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "RUF", "ANN", "D", "TID", "Q"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Tests keep full type annotations but relax docstrings — test names document intent.
"tests/*" = ["D"]
# Examples are simple runnable scripts; the module docstring documents intent.
"examples/*" = ["D103"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = [
    "tests.py",
    "test_*.py",
    "tests_*.py",
    "*_tests.py",
    "*_test.py",
]
addopts = "--cov=groveyard --cov-report=term-missing"

[tool.coverage.run]
source = ["src/groveyard"]
branch = true

[tool.coverage.report]
# The fake-transport-only test suite cannot exercise the real i2c backend
# (no Raspberry Pi in CI) or the defensive branches guarded by comments below.
exclude_also = [
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
    "# pragma: no cover",
]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests", "examples"]
